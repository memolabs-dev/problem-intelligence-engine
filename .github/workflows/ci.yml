name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: pie
          POSTGRES_PASSWORD: pie
          POSTGRES_DB: problem_intelligence_engine
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pie -d problem_intelligence_engine"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGDATABASE: problem_intelligence_engine
      PGUSER: pie
      PGPASSWORD: pie
      PIE_INTEGRATION: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify source syntax
        run: find packages tests -name '*.mjs' -print0 | xargs -0 -n1 node --check
      - name: Migrate PostgreSQL and pgvector
        run: pnpm run db:migrate
      - name: Run unit and PostgreSQL integration tests
        run: pnpm test
